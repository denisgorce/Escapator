<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>Escapator | Escape game</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="application-name" content="Escapator">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d141b;--pan:rgba(20,30,40,.84);--pan2:rgba(255,255,255,.05);--line:rgba(255,255,255,.11);--txt:#eef3f7;--mut:#9aabbb;--acc:#ffc233;--acc2:#ff8a3d;--ok:#4fd1a5;--bad:#ff5a4e;--glow:rgba(255,194,51,.35);--disp:'Chakra Petch',system-ui,sans-serif;--body:'Barlow',system-ui,sans-serif;--r:14px}
body[data-th=omega]{--bg:#0b120f;--pan:rgba(15,27,22,.86);--acc:#ffc233;--acc2:#9dff9e;--glow:rgba(255,194,51,.35)}
body[data-th=kraken]{--bg:#03121a;--pan:rgba(4,29,41,.86);--acc:#3fd0e0;--acc2:#7cf5d8;--glow:rgba(63,208,224,.38)}
body[data-th=heist]{--bg:#120b0e;--pan:rgba(33,18,23,.88);--acc:#ff6b57;--acc2:#e3b964;--glow:rgba(255,107,87,.38)}
body[data-th=zenith]{--bg:#0a0818;--pan:rgba(21,16,48,.86);--acc:#b18cff;--acc2:#ffd27a;--glow:rgba(177,140,255,.42)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 var(--body);overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
button{cursor:pointer;font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scr{position:relative;z-index:1;display:none;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 34px);max-width:520px;margin:0 auto}
.scr.on{display:block;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
body.hud .scr{padding-top:calc(env(safe-area-inset-top,0px) + 86px)}
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 14px;background:linear-gradient(180deg,var(--bg) 55%,transparent)}
body.hud #hud{display:flex}
#tbar{position:absolute;left:16px;right:16px;bottom:4px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
#tbar i{display:block;height:100%;width:100%;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .3s linear}
#time{font:700 38px/1 var(--disp);color:var(--acc);font-variant-numeric:tabular-nums;text-shadow:0 0 22px var(--glow)}
#hud.alert #time{color:var(--bad);text-shadow:0 0 22px rgba(255,90,78,.55);animation:pulse 1s infinite}
#hud.alert #tbar i{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.hs{font-size:12px;color:var(--mut);min-width:86px}
.hs.r{text-align:right}
.hs b{color:var(--txt);font:700 17px var(--disp);display:block}
.hb{display:flex;gap:6px;justify-content:flex-end;margin-bottom:3px}
.ib{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;font:700 13px var(--disp)}
.ib svg{width:17px;height:17px}
#pen{position:fixed;top:78px;left:50%;transform:translateX(-50%);font:700 26px var(--disp);color:var(--bad);opacity:0;z-index:45;pointer-events:none;text-shadow:0 0 16px rgba(255,90,78,.6)}
#pen.go{animation:pen 1.4s}
@keyframes pen{15%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
@keyframes pulse{50%{opacity:.45}}
#flash{position:fixed;inset:0;background:#fff;z-index:60;display:none}
#flash.on{display:block}
#alarm{position:fixed;inset:0;z-index:30;pointer-events:none;box-shadow:inset 0 0 140px rgba(255,40,40,.6);opacity:0}
#alarm.on{animation:alarm 1.2s infinite}
@keyframes alarm{50%{opacity:1}}
h1{font:700 44px/.95 var(--disp);letter-spacing:-.01em;margin:8px 0 12px}
h2{font:700 27px/1.05 var(--disp)}
p{margin:10px 0}
.mut{color:var(--mut);font-size:14.5px}
.c{text-align:center}
.top{display:flex;align-items:center;gap:10px}
.langs{display:flex;gap:4px}
.langs button{background:var(--pan2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 11px;font:700 14px var(--disp)}
.langs button.on{background:var(--acc);border-color:var(--acc);color:#140f00}
.top .ib{margin-left:auto}
.btn{position:relative;display:block;width:100%;padding:18px;margin-top:18px;border:0;border-radius:12px;background:var(--acc);color:#120d00;font:700 19px var(--disp);letter-spacing:.02em;box-shadow:0 8px 28px var(--glow),inset 0 -3px 0 rgba(0,0,0,.18);overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-100%)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn:not(:disabled):active::after{transform:translateX(100%);transition:transform .5s}
.btn:disabled{background:var(--pan2);color:var(--mut);box-shadow:none;border:1px dashed var(--line)}
.sec{background:var(--pan2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14.5px;font-weight:600}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;margin-top:20px}
.back{background:none;border:0;color:var(--acc);font-weight:600;font-size:15px;padding:6px 0}
.note{font-size:14px;color:var(--mut);border-left:3px solid var(--acc);padding:8px 12px;margin-top:18px;background:var(--pan);border-radius:0 8px 8px 0}
.note.err{border-color:var(--bad);color:var(--txt);background:rgba(255,90,78,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid var(--c,var(--acc));color:var(--c,var(--acc))}
.ico{display:block;width:100%;height:100%}
/* intro */
.emblem{width:156px;margin:14px auto 0}
.emblem svg{display:block;width:100%;overflow:visible}
.brand{text-align:center;font-size:50px;margin:8px 0 6px;animation:flick 1.6s .2s both}
@keyframes flick{0%{opacity:0}10%{opacity:.8}14%{opacity:.1}22%{opacity:1}28%{opacity:.3}40%,100%{opacity:1}}
.tag{text-align:center;color:var(--mut);max-width:32ch;margin:0 auto}
.scen{display:grid;gap:16px;margin-top:24px}
.sc{position:relative;display:block;width:100%;text-align:left;padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#090d12;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 14px 34px rgba(0,0,0,.45)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.sc .art{position:relative;height:150px}
.sc .art svg{display:block;width:100%;height:100%}
.sc .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(9,13,18,.95))}
.sc .ttl{position:absolute;left:16px;right:16px;bottom:10px;z-index:2}
.sc .ttl b{display:block;font:700 26px/1 var(--disp);text-shadow:0 2px 14px #000}
.sc .body{padding:4px 16px 16px}
.sc .body p{font-size:14.5px;color:#c9d4de;margin:4px 0 10px}
.sc .icons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;color:var(--c)}
.sc .icons span{width:22px;height:22px;opacity:.9}
.sc.cur{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 14px 34px rgba(0,0,0,.45)}
.sc:active{transform:scale(.99)}
/* brief */
.hero{position:relative;margin:calc(-1 * (env(safe-area-inset-top,0px) + 18px)) -18px 0;height:46vh;min-height:260px;overflow:hidden}
.hero .art,.hero .art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 30%,transparent 55%,var(--bg) 100%)}
.hero .ov{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.hero .htxt{position:absolute;z-index:3;left:18px;right:18px;bottom:6px}
.hero h1{font-size:42px;text-shadow:0 3px 20px #000;margin:8px 0 0}
.hero.sm{height:170px;min-height:0;margin-top:0;margin-left:-18px;margin-right:-18px;border-radius:0}
.lead{font-size:17px;line-height:1.55;min-height:3.2em}
.tw::after{content:"▌";color:var(--acc);animation:pulse .8s infinite}
.ll{margin-top:18px;display:grid;gap:8px}
.lr{display:flex;align-items:center;gap:12px;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lr b{display:block;font:700 16px/1.2 var(--disp)}
.lr small{color:var(--mut);font-size:12.5px}
.bi{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--acc);background:radial-gradient(circle,var(--glow),transparent 70%);border:1px solid var(--line)}
.bi .ico{width:24px;height:24px}
/* hub */
.mhead{display:flex;align-items:center;gap:8px;color:var(--acc);font-weight:600;font-size:14px;margin-bottom:4px}
.tiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tiles span{width:44px;height:52px;display:grid;place-items:center;border-radius:8px;font:700 26px var(--disp);color:var(--acc);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 45%,rgba(0,0,0,.25));border:1px solid var(--acc);box-shadow:0 0 16px var(--glow),inset 0 1px 0 rgba(255,255,255,.2);text-shadow:0 0 10px var(--glow)}
.tiles span.e{border:1px dashed var(--line);box-shadow:none;background:var(--pan2)}
.tiles span.new{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.lock{position:relative;overflow:hidden;text-align:left;background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;min-height:128px;animation:rise .5s both}
.lock .bi{margin-bottom:10px}
.lock b{display:block;font:700 16px/1.15 var(--disp)}
.lock small{display:block;margin-top:3px;color:var(--mut);font-size:12.5px}
.led{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:pulse 2s infinite}
.lock.ok{border-color:rgba(79,209,165,.55);background:linear-gradient(160deg,rgba(79,209,165,.14),var(--pan) 60%)}
.lock.ok .led{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:none}
.lock.ok .bi{color:var(--ok)}
.lock.ok small{color:var(--ok);font-weight:600}
.wm{position:absolute;right:-4px;bottom:-22px;font:700 96px/1 var(--disp);color:var(--ok);opacity:.12}
/* puzzle */
.cap{margin-left:auto;font-size:12.5px;border:1px solid var(--line);background:var(--pan);padding:4px 11px;border-radius:20px;color:var(--mut)}
.phead{display:flex;align-items:center;gap:14px;margin-top:10px}
.phead .bi{width:58px;height:58px;box-shadow:0 0 26px var(--glow)}
.phead .bi .ico{width:32px;height:32px}
.story{margin-top:14px;background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15.5px}
.story b{color:var(--acc)}
#pB{margin-top:16px}
.st{text-align:center;font-weight:600;margin-top:12px;min-height:1.5em}
.lbl{font-size:13px;color:var(--mut);margin-top:14px}
.bar{height:14px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--glow);transition:width .12s}
.bar.big{height:18px}
.hint{margin-top:24px;border-top:1px dashed var(--line);padding-top:14px}
.hint p{font-size:15px;color:var(--acc)}
.dbg{display:block;margin-top:12px;border-color:var(--bad);color:var(--bad)}
.byp{margin-top:14px}.byp .sec{margin-top:10px}
.big{font:700 58px/1 var(--disp);font-variant-numeric:tabular-nums;text-align:center;margin-top:10px;text-shadow:0 0 24px var(--glow)}
.dial{display:block;width:min(70vw,260px);margin:0 auto;filter:drop-shadow(0 0 18px var(--glow))}
.dial line{stroke:var(--mut);stroke-width:2}
.dial text{fill:var(--txt);font:700 11px var(--disp);text-anchor:middle}
.dial .ring{fill:rgba(0,0,0,.3);stroke:var(--line);stroke-width:3}
.dial .knob{fill:var(--pan);stroke:var(--acc);stroke-width:2}
.dial .ptr{fill:var(--acc)}
canvas#mz{display:block;margin:0 auto;border:1px solid var(--line);border-radius:10px;touch-action:none;box-shadow:0 0 30px rgba(0,0,0,.5)}
.row{display:flex;justify-content:center;margin-top:12px}
.core{width:120px;height:120px;margin:40px auto;border-radius:50%;display:grid;place-items:center;font-size:48px;border:2px solid var(--acc);background:radial-gradient(circle,rgba(255,194,51,.35),rgba(0,0,0,.6));transition:transform .1s}
.code{display:flex;gap:10px;justify-content:center;margin:18px 0}
.code span{width:60px;height:70px;border:1px solid var(--acc);border-radius:10px;display:grid;place-items:center;font:700 34px var(--disp);color:var(--acc);background:rgba(0,0,0,.35);box-shadow:inset 0 0 18px var(--glow)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:15px 0;background:var(--pan);border:1px solid var(--line);font:700 24px var(--disp);border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.pad button:active{background:var(--acc);color:#120d00}
.pad .wide{grid-column:span 3;font-size:15px}
.meter{position:relative;height:48px;background:rgba(0,0,0,.35);border:1px solid var(--line);margin-top:20px;border-radius:10px;overflow:hidden}
.meter .band{position:absolute;left:50%;width:22%;top:0;bottom:0;background:rgba(79,209,165,.18);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.meter .band.q{left:0;width:30%}
.meter i{position:absolute;left:0;top:12px;bottom:12px;width:0;border-radius:0 6px 6px 0;background:var(--acc);box-shadow:0 0 12px var(--glow)}
.meter i.in{background:var(--ok)}
.leg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:4px}
.steps{display:flex;gap:6px;margin-top:10px}
.steps span{flex:1;text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:10px;font:700 15px var(--disp);color:var(--mut);background:var(--pan)}
.steps .cur{border-color:var(--acc);color:var(--acc);box-shadow:0 0 16px var(--glow)}
.steps .ok{border-color:var(--ok);color:var(--ok);background:rgba(79,209,165,.1)}
.lux{position:relative;height:22px;margin-top:18px;background:linear-gradient(90deg,#000,#fff);border:1px solid var(--line);border-radius:6px}
.lux::before,.lux::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.lux::before{left:var(--a,11%)}.lux::after{left:var(--b,55%)}
.lux i{position:absolute;top:-6px;bottom:-6px;width:5px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc);left:0;transition:left .1s}
.hidv{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.radar{position:relative;width:min(60vw,230px);aspect-ratio:1;margin:8px auto;border-radius:50%;border:1px solid var(--acc);background:repeating-radial-gradient(circle,transparent 0 28px,rgba(255,255,255,.08) 28px 29px),radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,.6));overflow:hidden;box-shadow:0 0 30px var(--glow)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--glow),transparent 25%);animation:sw 2s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.blip{position:absolute;left:50%;top:50%;width:28px;height:28px;border-radius:50%;background:var(--acc);box-shadow:0 0 22px var(--acc);transform:translate(-50%,-50%);opacity:.15;transition:opacity .15s}
.arr{width:96px;height:96px;margin:0 auto;transition:transform .3s;filter:drop-shadow(0 0 14px var(--glow))}
.arr svg{width:100%;height:100%;fill:var(--acc)}
.port{position:relative;width:170px;height:170px;margin:10px auto;border-radius:50%;border:14px solid #1c3a45;box-shadow:0 0 0 3px #0a1c22,0 0 30px var(--glow),inset 0 0 30px rgba(0,0,0,.6);background:radial-gradient(circle at 35% 30%,#8ff3ff,#1a7f93 40%,#04222b);transition:background .2s}
.port::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:repeating-conic-gradient(#3fd0e0 0 2deg,transparent 2deg 45deg);mask:radial-gradient(circle,transparent 80px,#000 81px 84px,transparent 85px);-webkit-mask:radial-gradient(circle,transparent 80px,#000 81px 84px,transparent 85px)}
.port.shut{background:#02080b}
.lvl{position:relative;width:230px;height:230px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(0,0,0,.5));border:2px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.lvl::before,.lvl::after{content:"";position:absolute;background:var(--line)}
.lvl::before{left:50%;top:10px;bottom:10px;width:1px}.lvl::after{top:50%;left:10px;right:10px;height:1px}
.lvl .ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px dashed var(--ok)}
.bub{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--acc) 55%);box-shadow:0 0 16px var(--acc)}
.bub.in{background:radial-gradient(circle at 35% 35%,#fff,var(--ok) 55%);box-shadow:0 0 16px var(--ok)}
.fp{position:relative;height:280px;margin-top:6px;border:2px solid var(--acc);border-radius:22px;background:radial-gradient(circle at 50% 50%,var(--glow),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 8px);overflow:hidden;touch-action:none;box-shadow:0 0 30px var(--glow)}
.scanl{position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc);box-shadow:0 0 16px var(--acc);animation:scn 2.4s ease-in-out infinite alternate}
@keyframes scn{to{top:100%}}
.dot{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:2px solid var(--acc);background:radial-gradient(circle,var(--glow),transparent);box-shadow:0 0 18px var(--acc)}
.nfc{font-size:100px;text-align:center;margin:14px 0;filter:drop-shadow(0 0 24px var(--glow));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.rosew{position:relative;width:220px;margin:12px auto}
.rosew::before{content:"";position:absolute;left:50%;top:-12px;margin-left:-9px;border:9px solid transparent;border-top:13px solid var(--acc);z-index:2;filter:drop-shadow(0 0 6px var(--acc))}
.rose{position:relative;width:220px;height:220px;border-radius:50%;border:2px solid var(--line);background:repeating-conic-gradient(rgba(255,255,255,.12) 0 1deg,transparent 1deg 15deg),radial-gradient(circle,var(--pan),rgba(0,0,0,.5));transition:transform .15s;box-shadow:0 0 30px var(--glow)}
.rose span{position:absolute;font:700 22px var(--disp)}
.rose .n{top:10px;left:50%;transform:translateX(-50%);color:var(--bad)}
.rose .s{bottom:10px;left:50%;transform:translateX(-50%)}
.rose .e{right:14px;top:50%;transform:translateY(-50%)}
.rose .w{left:14px;top:50%;transform:translateY(-50%)}
.sky{position:relative;height:52vh;background:radial-gradient(circle at 50% 120%,#2a1760,#05040d);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.sky video{width:100%;height:100%;object-fit:cover;opacity:.75}
.cross{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid var(--acc);border-radius:50%;box-shadow:0 0 18px var(--acc)}
.cross::before,.cross::after{content:"";position:absolute;background:var(--acc)}
.cross::before{left:50%;top:-14px;bottom:-14px;width:1px}.cross::after{top:50%;left:-14px;right:-14px;height:1px}
.tgt{position:absolute;font-size:36px;color:#fff;transform:translate(-50%,-50%);text-shadow:0 0 16px var(--acc)}

@keyframes cpop{from{transform:scale(.3);opacity:0}}@keyframes cup{from{transform:translateY(14px);opacity:0}}
@keyframes ctick{from{transform:scale(1.9);opacity:0}35%{opacity:1;transform:scale(1)}to{transform:scale(.85);opacity:.15}}
#cine .door{position:absolute;top:0;bottom:0;width:50.5%;z-index:1;background:linear-gradient(90deg,#16202a,#2c3a48 60%,#1b2632);box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
#cine .door.l{left:0}#cine .door.r{right:0}
#cine .door::after{content:"";position:absolute;top:0;bottom:0;width:12px;background:repeating-linear-gradient(45deg,var(--acc) 0 9px,#111 9px 18px)}
#cine .door.l::after{right:0}#cine .door.r::after{left:0}
#cine.open .door.l{animation:dl 1.1s .95s cubic-bezier(.7,0,.3,1) forwards}#cine.open .door.r{animation:dr 1.1s .95s cubic-bezier(.7,0,.3,1) forwards}
#cine.open .cin{animation:cfadeo .4s .85s forwards}
#cine.open{background:transparent}
@keyframes dl{to{transform:translateX(-101%)}}@keyframes dr{to{transform:translateX(101%)}}
#cine.lose{background:radial-gradient(circle,rgba(90,0,0,.8),rgba(10,0,0,.96))}
#cine.lose .ct{color:var(--bad);animation:cup .5s .3s both,glitch .28s steps(2) .8s 6}
#cine.lose::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px)}
@keyframes glitch{50%{transform:translate(4px,-2px);text-shadow:-3px 0 #0ff,3px 0 #f0f}}
#cine.all .cic{animation:cpop .6s .1s both,unlock 1.2s .7s both}
@keyframes unlock{50%{transform:scale(1.25) rotate(-8deg)}}
/* affichage compact et Oki discret */
body.mini-oki #okiBtn{width:58px;height:63px}
body.mini-oki .obub{margin-bottom:34px}
.tbar summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.tbar summary::-webkit-details-marker{display:none}
.tbar summary span{margin-left:auto;font-size:15px;opacity:.9}
.tbar[open] summary span{opacity:.4}
.hero .skip{left:auto;right:16px}
@media (max-height:720px){
 body.hud .scr{padding-top:calc(env(safe-area-inset-top,0px) + 74px)}
 #time{font-size:32px}
 .phead{margin-top:4px;gap:10px}.phead .bi{width:46px;height:46px}.phead .bi .ico{width:26px;height:26px}
 h2{font-size:23px}
 .story{margin-top:10px;padding:9px 12px;font-size:14.5px}
 #pB{margin-top:12px}
 .hero{height:40vh}.hero.md{height:30vh}
 .dial,.wheel{width:min(62vw,230px)}
 .radar{width:min(50vw,190px)}
 .lvl,.rose,.rosew{width:200px}.lvl,.rose{height:200px}
 .pad button{padding:12px 0}
 .code span{height:58px}
 .sky{height:44vh}
 .fp{height:230px}
}
.emblem{width:170px}
.lg-ring{transform-box:view-box;transform-origin:256px 286px;animation:spin 40s linear infinite}
.lg-ant{transform-box:fill-box;transform-origin:center;animation:apulse 1.8s ease-in-out infinite}
.lg-eyes{transform-box:fill-box;transform-origin:center;animation:oblink 4s infinite}
body.eco .lg-ring,body.eco .lg-ant,body.eco .lg-eyes{animation:none}

  <div class="ll" id="gt"></div>
  <p class="note" data-t="notePen"></p>
  <button class="btn" id="go" data-t="launch"></button>

<section class="scr" id="story">

<section class="scr" id="team">

  <h2 data-t="teamT"></h2>
  <p class="mut" data-t="teamS"></p>
  <div class="nplay" id="tN"></div>
  <p class="note" id="tSolo" data-t="soloS"></p>

    <div id="tNames"></div>
    <label class="rot"><input type="checkbox" id="tRot"><span data-t="teamRot"></span></label>
    <div class="pcs" id="tPcs"></div>
    <button class="sec" id="tMix" data-t="teamMix"></button>
    <div class="rls" id="tRls"></div>
  </div>
  <button class="btn" id="tGo"></button>
</section>

<section class="scr" id="hub">
  <div class="mhead" id="hubN"></div>
  <h2 id="hubT"></h2>
  <p class="mut" data-t="hubS"></p>
  <div class="hlinks"><button class="lnk sty" id="hStory" data-t="story"></button><button class="lnk sty" id="hTeam" data-t="teamBtn"></button></div>
  <div id="hubTeam"></div>
  <div class="tiles" id="lt"></div>
  <div id="grid"></div>
  <button class="btn" id="goF" data-t="openM" disabled></button>
  <p class="c"><button class="lnk" id="rst" data-t="abandon"></button></p>
</section>

<section class="scr" id="puz">

  <div class="phead"><div class="bi" id="pIc"></div><h2 id="pT"></h2></div>

  <div id="pTeam"></div>
  <div id="pB"></div>

<section class="scr" id="final">

E.nono = function(el, done, p, c){
  var G = FONT[c.d], R = 7, C = 5, cell = [], i, j;
  for (i = 0; i < R * C; i++) cell.push(0);
  function runs(arr){ var o = [], n = 0; arr.forEach(function(v){ if (v) n++; else if (n) { o.push(n); n = 0; } }); if (n) o.push(n); return o.length ? o : [0]; }
  var rc = [], cc = [];
  for (i = 0; i < R; i++) rc.push(runs(G[i].split('').map(Number)));
  for (j = 0; j < C; j++) cc.push(runs(G.map(function(r){ return +r[j]; })));
  var html = '<table class="nn"><tr><td></td>' + cc.map(function(k){ return '<th>' + k.join('<br>') + '</th>'; }).join('') + '</tr>';
  for (i = 0; i < R; i++) { html += '<tr><th>' + rc[i].join(' ') + '</th>'; for (j = 0; j < C; j++) html += '<td><button data-i="' + (i * C + j) + '"></button></td>'; html += '</tr>'; }
  el.innerHTML = html + '</table><p class="mut c" data-t="no_help"></p><p class="st" id="st"></p>';
  function check(){
    for (var a = 0; a < R; a++) if (runs(cell.slice(a * C, a * C + C).map(function(v){ return v === 1 ? 1 : 0; })).join() !== rc[a].join()) return false;
    for (var b = 0; b < C; b++) { var col = []; for (var r = 0; r < R; r++) col.push(cell[r * C + b] === 1 ? 1 : 0); if (runs(col).join() !== cc[b].join()) return false; }
    return true;
  }
  el.querySelectorAll('.nn button').forEach(function(b){ b.onclick = function(){
    var k = +b.getAttribute('data-i'); cell[k] = (cell[k] + 1) % 3; b.className = ['', 'f', 'x'][cell[k]]; beep(cell[k] === 1 ? 1000 : 600, .02, 'square', .03);
    if (check()) { el.querySelector('.nn').classList.add('won'); later(done, 1200); }
  }; });
};
E.seq = function(el, done, p, c){
  var d = c.d, s = c.s, t = c.t === 'ar' ? [d + 4 * s, d + 3 * s, d + 2 * s, d + s, '?'] : c.t === 'geo' ? [d * 16, d * 8, d * 4, d * 2, '?'] : ['?', s, d + s, d + 2 * s, 2 * d + 3 * s];
  el.innerHTML = '<div class="sq">' + t.map(function(x){ return '<span' + (x === '?' ? ' class="qq"' : '') + '>' + x + '</span>'; }).join('') + '</div><p class="mut c" data-t="sq_q"></p>';
  keypad(el, function(v){ if (+v === d) { done(); return true; } return false; }, 1);
  el.appendChild(h('p', 'st')); el.lastChild.id = 'st';
};

var EPI = {"omega": [{"n": {"fr": "Code Oméga", "en": "Code Omega", "ru": "Код «Омега»"}, "tz": {"fr": "L’alarme a sonné. Toutes les portes se sont verrouillées.", "en": "The alarm went off. Every door has locked.", "ru": "Сработала тревога. Все двери заперты."}, "st": {"fr": ["Il est 23 h 47 au laboratoire Hélix. Tu terminais ta garde de nuit quand les néons ont viré à l’orange et qu’une voix synthétique a prononcé deux mots : « Protocole Oméga ».", "Les portes blindées sont tombées d’un seul bloc. Selon le règlement, personne ne ressort avant l’arrivée des équipes de décontamination… dans 72 heures.", "Mais dans le casier du professeur Varga, tu trouves une note griffonnée : « Le système de secours s’ouvre avec un mot et un code. Tout est caché dans les verrous du labo. »", "Oki, la mascotte expérimentale du labo, dresse ses oreilles-antennes. Le compte à rebours du verrouillage définitif vient de démarrer."], "en": ["It is 11:47 pm at the Helix lab. You were finishing your night shift when the lights turned orange and a synthetic voice said two words: “Protocol Omega”.", "The blast doors slammed shut. By the rules, nobody leaves before the decontamination teams arrive… in 72 hours.", "But in Professor Varga’s locker you find a scribbled note: “The backup system opens with a word and a code. Everything is hidden in the lab’s locks.”", "Oki, the lab’s experimental mascot, pricks up his antenna ears. The countdown to permanent lockdown has just begun."], "ru": ["23:47, лаборатория «Геликс». Ты заканчивал ночную смену, когда лампы стали оранжевыми и синтетический голос произнёс: «Протокол Омега».", "Бронированные двери захлопнулись. По правилам никто не выйдет до приезда команды дезинфекции… через 72 часа.", "Но в шкафчике профессора Варги ты находишь записку: «Резервная система открывается словом и кодом. Всё спрятано в замках лаборатории».", "Оки, экспериментальный талисман лаборатории, насторожил уши-антенны. Обратный отсчёт до полной блокировки начался."]}, "end": {"fr": "La porte principale glisse enfin. Dehors, l’air frais de la nuit. Le professeur Varga t’attend avec un sourire : « Test réussi. Bienvenue dans l’équipe. »", "en": "The main door finally slides open. Outside, cool night air. Professor Varga is waiting with a smile: “Test passed. Welcome to the team.”", "ru": "Главная дверь наконец отъезжает. Снаружи свежий ночной воздух. Профессор Варга улыбается: «Испытание пройдено. Добро пожаловать в команду»."}, "w": {"fr": "LIBRES", "en": "LIBRES", "ru": "LIBRES"}, "wh": {"fr": "Ce que vous serez en sortant (au pluriel).", "en": "What you will be once outside, in French (plural).", "ru": "Какими вы станете, выйдя наружу (по-французски, мн. ч.)."}}, {"n": {"fr": "La souche X-17", "en": "Strain X-17", "ru": "Штамм X-17"}, "tz": {"fr": "Une éprouvette brisée. Un virus inconnu. Un seul remède.", "en": "A broken test tube. An unknown virus. One cure.", "ru": "Разбитая пробирка. Неизвестный вирус. Одно лекарство."}, "st": {"fr": ["Une éprouvette de la souche X-17 s’est brisée dans la salle froide. Le virus n’est pas mortel, mais quiconque le respire se met à cancaner comme un canard.", "Le labo s’est mis en quarantaine automatique. Toute l’équipe cancane déjà dans le couloir, et le directeur doit présenter ses résultats à la télévision dans une heure.", "La docteure Amani avait mis au point la formule du remède, puis l’a dispersée dans les verrous du bâtiment pour que personne ne la vole.", "Oki renifle l’air : lui est immunisé. À vous deux de reconstituer le mot de la formule avant que le monde entier n’entende le directeur faire « coin-coin »."], "en": ["A vial of strain X-17 shattered in the cold room. The virus isn’t deadly, but anyone who breathes it starts to quack like a duck.", "The lab has sealed itself in automatic quarantine. The whole team is already quacking in the corridor, and the director goes live on TV in one hour.", "Doctor Amani had perfected the cure’s formula, then scattered it across the building’s locks so no one could steal it.", "Oki sniffs the air: he’s immune. Together you must rebuild the formula’s word before the whole world hears the director go “quack”."], "ru": ["В холодильной комнате разбилась пробирка со штаммом X-17. Вирус не смертелен, но каждый, кто его вдохнёт, начинает крякать, как утка.", "Лаборатория ушла на автоматический карантин. Вся команда уже крякает в коридоре, а директор через час выступает в прямом эфире.", "Доктор Амани разработала лекарство, а потом спрятала рецепт по частям в замках здания, чтобы его никто не украл.", "Оки принюхивается: у него иммунитет. Вместе вам нужно собрать рецепт, пока весь мир не услышал, как директор говорит «кря»."]}, "end": {"fr": "Le remède est synthétisé à temps. Le directeur retrouve sa voix trente secondes avant le direct… et Oki garde en souvenir un tout petit « coin » d’émotion.", "en": "The cure is synthesised just in time. The director gets his voice back thirty seconds before going live… and Oki keeps one tiny “quack” as a souvenir.", "ru": "Лекарство готово вовремя. Директор возвращает голос за тридцать секунд до эфира… а Оки на память остаётся одно маленькое «кря»."}, "w": {"fr": "REMEDE", "en": "REMEDE", "ru": "REMEDE"}, "wh": {"fr": "Ce que la docteure Amani a mis au point (sans accent).", "en": "What Doctor Amani developed, in French (no accent).", "ru": "То, что создала доктор Амани (по-французски, без акцента)."}}, {"n": {"fr": "La serre interdite", "en": "The Forbidden Greenhouse", "ru": "Запретная оранжерея"}, "tz": {"fr": "Les plantes ont poussé cette nuit. Beaucoup trop.", "en": "The plants grew overnight. Far too much.", "ru": "Растения выросли за ночь. Слишком сильно."}, "st": {"fr": ["Au sous-sol du labo, la serre expérimentale testait un engrais miracle. Cette nuit, quelqu’un a oublié de fermer la vanne.", "Au matin, des lianes géantes ont envahi les couloirs, enroulé les caméras et bloqué toutes les sorties. Elles frémissent quand on s’approche.", "Le botaniste a laissé un message : pour calmer la plante mère, il faut taper son mot secret dans la console centrale. Il l’a découpé et caché dans les verrous.", "Oki se faufile entre les feuilles, ses antennes clignotent : la plante mère se réveille. Il est temps d’agir."], "en": ["In the lab basement, the experimental greenhouse was testing a miracle fertiliser. Last night, someone forgot to close the valve.", "By morning, giant vines had invaded the corridors, wrapped the cameras and blocked every exit. They quiver when you come close.", "The botanist left a message: to calm the mother plant, type its secret word into the central console. He split it up and hid it in the locks.", "Oki slips between the leaves, antennas blinking: the mother plant is waking up. Time to act."], "ru": ["В подвале лаборатории оранжерея испытывала чудо-удобрение. Ночью кто-то забыл закрыть кран.", "К утру гигантские лианы заполнили коридоры, опутали камеры и перекрыли все выходы. Они дрожат, когда к ним подходишь.", "Ботаник оставил сообщение: чтобы успокоить растение-мать, нужно ввести его тайное слово в центральный пульт. Он разделил слово и спрятал в замках.", "Оки пробирается между листьями, его антенны мигают: растение-мать просыпается. Пора действовать."]}, "end": {"fr": "La plante mère se rendort en ronronnant presque. Les lianes se rétractent doucement. Oki, lui, garde une petite pousse dans un pot : il l’a appelée Brindille.", "en": "The mother plant drifts back to sleep, almost purring. The vines slowly pull back. Oki keeps one little sprout in a pot: he named it Twig.", "ru": "Растение-мать засыпает, будто мурлыча. Лианы медленно отступают. А Оки оставляет себе маленький росток в горшке и называет его Веточкой."}, "w": {"fr": "RACINE", "en": "RACINE", "ru": "RACINE"}, "wh": {"fr": "Ce qui ancre la plante mère dans le sol.", "en": "What anchors the mother plant in the soil, in French.", "ru": "То, что держит растение-мать в земле (по-французски)."}}], "kraken": [{"n": {"fr": "Profondeur 300", "en": "Depth 300", "ru": "Глубина 300"}, "tz": {"fr": "Un choc, puis le silence. Le Nautilus II ne répond plus.", "en": "An impact, then silence. The Nautilus II is dead in the water.", "ru": "Удар, затем тишина. «Наутилус II» не отвечает."}, "st": {"fr": ["Le sous-marin de recherche Nautilus II descendait vers une faille inexplorée quand une ombre immense est passée devant les hublots.", "Un choc sourd. Les moteurs se sont coupés, les écrans sont devenus noirs. Le capitaine, sonné, a juste eu le temps de murmurer : « Le code de remontée… dans les verrous du bord. »", "L’oxygène baisse. Au-dehors, des tentacules frôlent la coque, curieux. Le Kraken n’est pas méchant, dit-on, mais il déteste le bruit.", "Oki ajuste son casque de plongée. Il faut remettre le navire en état et revoir la surface."], "en": ["The research sub Nautilus II was diving towards an unexplored rift when a huge shadow slid past the portholes.", "A dull thud. The engines died, the screens went black. The dazed captain only had time to whisper: “The surfacing code… in the ship’s locks.”", "Oxygen is dropping. Outside, tentacles brush the hull, curious. They say the Kraken isn’t mean, but it hates noise.", "Oki adjusts his diving helmet. The ship must be repaired, and the surface is waiting."], "ru": ["Исследовательская подлодка «Наутилус II» спускалась к неизведанному разлому, когда мимо иллюминаторов проплыла огромная тень.", "Глухой удар. Двигатели заглохли, экраны погасли. Оглушённый капитан успел прошептать: «Код всплытия… в замках на борту».", "Кислород убывает. Снаружи щупальца с любопытством касаются корпуса. Говорят, Кракен не злой, но терпеть не может шума.", "Оки поправляет водолазный шлем. Нужно починить корабль и снова увидеть поверхность."]}, "end": {"fr": "Les ballasts se vident dans un grondement joyeux. Le Nautilus II jaillit sous un soleil éclatant, et au loin, une grande ombre agite un tentacule en guise d’au revoir.", "en": "The ballast tanks empty with a joyful roar. The Nautilus II bursts into bright sunshine, and far away a huge shadow waves a tentacle goodbye.", "ru": "Балластные цистерны с радостным гулом пустеют. «Наутилус II» выныривает под ярким солнцем, а вдали огромная тень машет щупальцем на прощание."}, "w": {"fr": "RIVAGE", "en": "RIVAGE", "ru": "RIVAGE"}, "wh": {"fr": "Ce que l’équipage espère revoir.", "en": "What the crew hopes to see again, in French.", "ru": "Что экипаж мечтает снова увидеть (по-французски)."}}, {"n": {"fr": "Le trésor englouti", "en": "The Sunken Treasure", "ru": "Затонувшее сокровище"}, "tz": {"fr": "Une épave légendaire. Un coffre scellé. Un gardien à huit bras.", "en": "A legendary wreck. A sealed chest. An eight-armed guardian.", "ru": "Легендарный корабль. Запечатанный сундук. Восьмирукий страж."}, "st": {"fr": ["Depuis trois siècles, la frégate La Sirène d’Or repose par 300 mètres de fond. La légende raconte que sa cale renferme le collier de la reine des mers.", "Ton sonar vient enfin de la localiser. Mais à peine arrimé à l’épave, le sas du sous-marin se bloque : le vieux mécanisme de la cale s’est refermé sur vous.", "Sur la paroi, une inscription gravée : « Seul celui qui nomme le trésor repartira avec lui. » Les lettres du mot sont dispersées dans les mécanismes du navire.", "Et dans l’ombre, deux yeux énormes vous observent. Oki chuchote : « Je crois que le trésor a déjà un propriétaire… »"], "en": ["For three centuries the frigate Golden Siren has lain 300 metres down. Legend says her hold contains the necklace of the queen of the seas.", "Your sonar has finally found her. But as soon as you dock with the wreck, the sub’s hatch jams: the hold’s old mechanism has shut around you.", "An inscription is carved on the wall: “Only one who names the treasure shall leave with it.” The word’s letters are scattered across the ship’s mechanisms.", "And in the shadows, two enormous eyes are watching. Oki whispers: “I think the treasure already has an owner…”"], "ru": ["Три века фрегат «Золотая Сирена» лежит на глубине 300 метров. Легенда гласит, что в его трюме хранится ожерелье морской царицы.", "Твой сонар наконец нашёл его. Но едва подлодка пристыковалась к обломкам, люк заклинило: старый механизм трюма захлопнулся.", "На стене вырезана надпись: «Лишь тот, кто назовёт сокровище, уйдёт вместе с ним». Буквы слова спрятаны в механизмах корабля.", "А из темноты на вас смотрят два огромных глаза. Оки шепчет: «Кажется, у сокровища уже есть хозяин…»"]}, "end": {"fr": "Le coffre s’ouvre sur un collier irisé. Le Kraken s’approche, le touche délicatement d’un tentacule… puis vous le rend. Il voulait juste que quelqu’un le trouve.", "en": "The chest opens on an iridescent necklace. The Kraken drifts over, gently touches it with a tentacle… then hands it back. It only wanted someone to find it.", "ru": "Сундук открывается: внутри переливающееся ожерелье. Кракен подплывает, осторожно касается его щупальцем… и возвращает вам. Он просто хотел, чтобы его нашли."}, "w": {"fr": "PERLES", "en": "PERLES", "ru": "PERLES"}, "wh": {"fr": "Trésors nés dans une huître.", "en": "Treasures born in an oyster, in French.", "ru": "Сокровища, рождённые в устрице (по-французски)."}}, {"n": {"fr": "La sonde perdue", "en": "The Lost Probe", "ru": "Потерянный зонд"}, "tz": {"fr": "Un signal faible remonte des profondeurs. Quelqu’un appelle à l’aide.", "en": "A faint signal rises from the deep. Someone is calling for help.", "ru": "Из глубины идёт слабый сигнал. Кто-то зовёт на помощь."}, "st": {"fr": ["La sonde Luciole devait cartographier la fosse la plus profonde de l’océan. Il y a trois jours, elle s’est tue.", "Ce matin, un signal a repris : trois bips, une pause, trois bips. Un appel de détresse. Le Nautilus II est le seul engin capable de descendre aussi bas.", "Mais au-delà de 300 mètres, le système de plongée exige un mot de passe que seul l’ingénieur en chef connaissait. Prudent, il l’a caché dans les verrous du bord.", "Oki colle son oreille au hublot. Dans le noir total, quelque chose de gigantesque semble suivre le signal, lui aussi."], "en": ["The Firefly probe was mapping the deepest trench in the ocean. Three days ago it went silent.", "This morning a signal came back: three beeps, a pause, three beeps. A distress call. The Nautilus II is the only craft able to dive that deep.", "But beyond 300 metres, the dive system requires a password only the chief engineer knew. Being careful, he hid it in the ship’s locks.", "Oki presses his ear to the porthole. In the pitch dark, something gigantic seems to be following the signal too."], "ru": ["Зонд «Светлячок» должен был нанести на карту самую глубокую впадину океана. Три дня назад он замолчал.", "Сегодня утром сигнал вернулся: три писка, пауза, три писка. Сигнал бедствия. Только «Наутилус II» может опуститься так глубоко.", "Но ниже 300 метров система погружения требует пароль, который знал только главный инженер. Из осторожности он спрятал его в замках на борту.", "Оки прижимает ухо к иллюминатору. В кромешной тьме что-то гигантское, похоже, тоже идёт на сигнал."]}, "end": {"fr": "Vous atteignez la sonde : c’est le Kraken qui la tenait, comme un jouet précieux. Il la relâche quand Oki lui fait coucou. La Luciole remonte, avec la toute première carte du fond du monde.", "en": "You reach the probe: the Kraken was holding it like a precious toy. It lets go when Oki waves. The Firefly rises, carrying the very first map of the bottom of the world.", "ru": "Вы добираетесь до зонда: его держал Кракен, как драгоценную игрушку. Он отпускает его, когда Оки машет ему лапкой. «Светлячок» поднимается с первой картой дна мира."}, "w": {"fr": "ABYSSE", "en": "ABYSSE", "ru": "ABYSSE"}, "wh": {"fr": "Le gouffre le plus profond de l’océan.", "en": "The deepest chasm of the ocean, in French.", "ru": "Самая глубокая пропасть океана (по-французски)."}}], "heist": [{"n": {"fr": "Le coup du siècle", "en": "The Job of the Century", "ru": "Дело века"}, "tz": {"fr": "Une banque imprenable. Une nuit. Une seule chance.", "en": "An impregnable bank. One night. One chance.", "ru": "Неприступный банк. Одна ночь. Один шанс."}, "st": {"fr": ["La Banque Centrale de Valmont n’a jamais été cambriolée. Son coffre, surnommé « la Baleine », est protégé par dix verrous de sécurité.", "Tu n’es pas un voleur ordinaire : tu es le Chat, gentleman-cambrioleur, et tu ne voles que ceux qui ont volé les autres. Ce coffre contient la fortune détournée par le banquier Ravel.", "Ton plan est parfait : la relève des gardes laisse une fenêtre de quelques minutes. Au-delà, les portes se scellent jusqu’au matin.", "Oki, ton fidèle complice masqué, ajuste ses gants. « On entre, on ouvre, on ressort. Et on rend tout à ceux qui ont été dupés. »"], "en": ["The Central Bank of Valmont has never been robbed. Its vault, nicknamed “the Whale”, is guarded by ten security locks.", "You’re no ordinary thief: you are the Cat, gentleman burglar, and you only rob those who robbed others. This vault holds the fortune embezzled by banker Ravel.", "Your plan is perfect: the guards’ shift change leaves a window of a few minutes. After that, the doors seal until morning.", "Oki, your loyal masked accomplice, adjusts his gloves. “In, open, out. And we give it all back to the people who were cheated.”"], "ru": ["Центральный банк Вальмона ещё никто не грабил. Его сейф по прозвищу «Кит» охраняют десять замков.", "Ты не простой вор: ты Кот, благородный взломщик, и грабишь только тех, кто обокрал других. В этом сейфе лежит состояние, присвоенное банкиром Равелем.", "План безупречен: смена охраны оставляет окно в несколько минут. Потом двери запечатываются до утра.", "Оки, твой верный сообщник в маске, поправляет перчатки. «Вошли, открыли, вышли. И вернём всё обманутым людям»."]}, "end": {"fr": "La Baleine s’ouvre dans un soupir métallique. Au matin, chaque épargnant floué de Valmont trouve une enveloppe dans sa boîte aux lettres, signée d’une petite patte de renard.", "en": "The Whale opens with a metallic sigh. In the morning, every cheated saver in Valmont finds an envelope in their mailbox, signed with a little fox paw.", "ru": "«Кит» открывается с металлическим вздохом. Утром каждый обманутый вкладчик Вальмона находит в почтовом ящике конверт, подписанный маленькой лисьей лапкой."}, "w": {"fr": "TRESOR", "en": "TRESOR", "ru": "TRESOR"}, "wh": {"fr": "Ce qui dort dans le coffre (sans accent).", "en": "What sleeps in the vault, in French (no accent).", "ru": "То, что спит в сейфе (по-французски, без акцента)."}}, {"n": {"fr": "Les joyaux de la couronne", "en": "The Crown Jewels", "ru": "Алмазы короны"}, "tz": {"fr": "Volés il y a cent ans. Ce soir, ils rentrent chez eux.", "en": "Stolen a century ago. Tonight, they go home.", "ru": "Украдены сто лет назад. Сегодня они вернутся домой."}, "st": {"fr": ["Il y a cent ans, les joyaux de la petite principauté de Lorania ont disparu. On les croyait perdus… jusqu’à ce qu’ils réapparaissent dans le coffre privé du collectionneur Moreau.", "La princesse Elena t’a contacté en secret : les joyaux doivent revenir à son peuple avant la fête nationale, demain à l’aube.", "Moreau a fait installer dix verrous dernier cri. Il dort à l’étage du dessus, le sommeil léger et le doigt près de l’alarme.", "Oki enfile son masque et murmure : « Ce n’est pas un vol, c’est une restitution. Mais pas un bruit. »"], "en": ["A hundred years ago, the jewels of the tiny principality of Lorania vanished. Everyone thought them lost… until they turned up in collector Moreau’s private vault.", "Princess Elena contacted you in secret: the jewels must return to her people before the national day, tomorrow at dawn.", "Moreau has installed ten state-of-the-art locks. He sleeps upstairs, a light sleeper with a finger near the alarm.", "Oki pulls on his mask and whispers: “It’s not theft, it’s restitution. But not a sound.”"], "ru": ["Сто лет назад исчезли алмазы маленького княжества Лорания. Их считали потерянными… пока они не оказались в личном сейфе коллекционера Моро.", "Принцесса Елена тайно связалась с тобой: алмазы должны вернуться к её народу до национального праздника, завтра на рассвете.", "Моро установил десять новейших замков. Он спит этажом выше, чутко, держа палец у кнопки тревоги.", "Оки надевает маску и шепчет: «Это не кража, это возвращение. Но ни звука»."]}, "end": {"fr": "À l’aube, les cloches de Lorania sonnent à toute volée : les joyaux brillent de nouveau sur la couronne. Dans la foule, personne ne remarque un petit renard masqué qui applaudit.", "en": "At dawn, the bells of Lorania ring out: the jewels shine on the crown once more. In the crowd, nobody notices a little masked fox clapping.", "ru": "На рассвете колокола Лорании звонят во всю мощь: алмазы снова сияют на короне. В толпе никто не замечает маленького лиса в маске, который хлопает в ладоши."}, "w": {"fr": "JOYAUX", "en": "JOYAUX", "ru": "JOYAUX"}, "wh": {"fr": "Ce qui brille sur une couronne.", "en": "What sparkles on a crown, in French.", "ru": "То, что сверкает на короне (по-французски)."}}, {"n": {"fr": "Le coupable idéal", "en": "The Perfect Suspect", "ru": "Идеальный подозреваемый"}, "tz": {"fr": "On t’accuse d’un vol que tu n’as pas commis.", "en": "You’re accused of a theft you didn’t commit.", "ru": "Тебя обвиняют в краже, которой ты не совершал."}, "st": {"fr": ["Hier soir, le diamant Étoile du Nord a été volé à la banque de Valmont. Sur la vitrine, les enquêteurs ont trouvé… ta carte de visite. Quelqu’un t’a piégé.", "Le vrai coupable, c’est le directeur Ravel en personne : il a filmé toute l’opération et garde l’enregistrement dans son coffre personnel, au cœur de la banque.", "La police viendra te chercher au lever du jour. Tu as une nuit pour entrer, ouvrir le coffre et récupérer de quoi prouver ton innocence.", "Oki fronce ses sourcils de renard : « Personne ne touche à la réputation de mon associé. Allons chercher la vérité. »"], "en": ["Last night, the North Star diamond was stolen from the Valmont bank. On the display case, investigators found… your calling card. Someone framed you.", "The real culprit is director Ravel himself: he filmed the whole job and keeps the recording in his personal vault, at the heart of the bank.", "The police are coming for you at sunrise. You have one night to get in, open the vault and grab what proves your innocence.", "Oki frowns his fox eyebrows: “Nobody touches my partner’s reputation. Let’s go get the truth.”"], "ru": ["Вчера вечером из банка Вальмона украли алмаз «Северная звезда». На витрине следователи нашли… твою визитку. Тебя подставили.", "Настоящий преступник сам директор Равель: он снял всё на видео и хранит запись в личном сейфе в сердце банка.", "Полиция придёт за тобой на рассвете. У тебя одна ночь, чтобы проникнуть в банк, открыть сейф и забрать доказательства невиновности.", "Оки хмурит лисьи брови: «Никто не смеет порочить моего напарника. Идём за правдой»."]}, "end": {"fr": "L’enregistrement est entre tes mains. Au petit matin, l’inspectrice Lin le visionne, lève un sourcil… et passe les menottes aux poignets de Ravel. Ton nom est lavé.", "en": "The recording is in your hands. At dawn, Inspector Lin watches it, raises an eyebrow… and snaps the handcuffs on Ravel. Your name is cleared.", "ru": "Запись у тебя в руках. На рассвете инспектор Лин просматривает её, поднимает бровь… и надевает наручники на Равеля. Твоё имя очищено."}, "w": {"fr": "PREUVE", "en": "PREUVE", "ru": "PREUVE"}, "wh": {"fr": "Ce qui t’innocentera.", "en": "What will clear your name, in French.", "ru": "То, что докажет твою невиновность (по-французски)."}}], "zenith": [{"n": {"fr": "Atterrissage forcé", "en": "Crash Landing", "ru": "Аварийная посадка"}, "tz": {"fr": "Ta capsule s’est posée loin de tout. La base ne répond plus.", "en": "Your capsule landed far from everything. Base is silent.", "ru": "Капсула села вдали от всего. База молчит."}, "st": {"fr": ["Mission Zénith, jour 214. Au retour d’une sortie d’exploration, une tempête magnétique a dévié ta capsule, qui s’est posée en catastrophe loin de la base.", "La radio grésille, le GPS s’affole. Pour rétablir le contact, il faut réaligner l’antenne, recalibrer la balise et envoyer le mot de reconnaissance de l’équipage.", "Ce mot, le commandant l’a fait graver en morceaux dans les systèmes de la capsule. Une vieille tradition de l’espace : on ne rentre qu’en se souvenant d’où l’on vient.", "Oki boucle son casque et regarde le ciel. « On va rentrer. Mais d’abord, il faut qu’ils nous entendent. »"], "en": ["Zenith mission, day 214. Returning from a survey trip, a magnetic storm threw your capsule off course and it crash-landed far from base.", "The radio crackles, the GPS is going haywire. To restore contact you must realign the antenna, recalibrate the beacon and send the crew’s recognition word.", "The commander had that word engraved piece by piece into the capsule’s systems. An old space tradition: you only come home if you remember where you come from.", "Oki fastens his helmet and looks up. “We’re going home. But first, they have to hear us.”"], "ru": ["Миссия «Зенит», день 214. На обратном пути из разведки магнитная буря сбила капсулу с курса, и она аварийно села вдали от базы.", "Рация трещит, GPS сходит с ума. Чтобы восстановить связь, нужно выровнять антенну, настроить маяк и передать опознавательное слово экипажа.", "Это слово командир по частям выгравировал в системах капсулы. Старая космическая традиция: вернёшься, только если помнишь, откуда ты.", "Оки застёгивает шлем и смотрит в небо. «Мы вернёмся. Но сначала они должны нас услышать»."]}, "end": {"fr": "« Ici la base, on vous reçoit cinq sur cinq ! » Au-dessus de toi, les étoiles semblent clignoter en réponse. Une navette de secours est déjà en route.", "en": "“Base here, we read you loud and clear!” Above you the stars seem to blink in reply. A rescue shuttle is already on its way.", "ru": "«Говорит база, слышим вас отлично!» Звёзды над тобой будто мигают в ответ. Спасательный челнок уже в пути."}, "w": {"fr": "ETOILE", "en": "ETOILE", "ru": "ETOILE"}, "wh": {"fr": "Elle brille au-dessus de toi la nuit (sans accent).", "en": "It shines above you at night, in French (no accent).", "ru": "Она сияет над тобой ночью (по-французски, без акцента)."}}, {"n": {"fr": "Premier contact", "en": "First Contact", "ru": "Первый контакт"}, "tz": {"fr": "Quelque chose d’autre s’est écrasé, juste à côté.", "en": "Something else crashed, right next to you.", "ru": "Что-то ещё упало совсем рядом."}, "st": {"fr": ["Cette nuit, une lueur verte a traversé le ciel et s’est posée derrière la colline. Au matin, tu découvres une petite créature lumineuse qui grelotte à côté d’un vaisseau en forme de coquillage.", "Elle ne parle pas, mais ses taches changent de couleur quand elle a peur ou quand elle est contente. Elle s’appelle, semble-t-il, Plip.", "Son vaisseau ne redécollera qu’avec un mot-clé en français, la première langue terrestre qu’il ait captée. Les fragments de ce mot se sont éparpillés dans les systèmes de ta capsule.", "Oki et Plip se regardent longuement, puis se touchent le bout du nez. « Je crois qu’on vient de se faire un ami. Aidons-le à rentrer chez lui. »"], "en": ["Last night a green glow crossed the sky and came down behind the hill. In the morning you find a small glowing creature shivering next to a shell-shaped ship.", "It doesn’t speak, but its spots change colour when it’s scared or happy. Its name seems to be Plip.", "Its ship will only take off with a keyword in French, the first Earth language it ever picked up. The fragments of that word have scattered through your capsule’s systems.", "Oki and Plip look at each other for a long time, then touch noses. “I think we just made a friend. Let’s help it get home.”"], "ru": ["Ночью по небу пронеслось зелёное сияние и опустилось за холмом. Утром ты находишь маленькое светящееся существо, которое дрожит рядом с кораблём в форме ракушки.", "Оно не говорит, но его пятнышки меняют цвет, когда ему страшно или радостно. Похоже, его зовут Плип.", "Его корабль взлетит, только получив ключевое слово по-французски: это первый земной язык, который он поймал. Части слова рассыпались по системам твоей капсулы.", "Оки и Плип долго смотрят друг на друга, потом касаются носами. «Кажется, у нас появился друг. Поможем ему вернуться домой»."]}, "end": {"fr": "Le coquillage s’illumine et s’élève doucement. Juste avant de disparaître, Plip dessine dans le ciel une constellation en forme de renard. Elle y est encore, si tu regardes bien.", "en": "The shell lights up and gently rises. Just before vanishing, Plip draws a fox-shaped constellation in the sky. It’s still there, if you look closely.", "ru": "Ракушка загорается и плавно взлетает. Перед тем как исчезнуть, Плип рисует в небе созвездие в форме лисы. Оно и сейчас там, если присмотреться."}, "w": {"fr": "AMITIE", "en": "AMITIE", "ru": "AMITIE"}, "wh": {"fr": "Ce qui unit deux êtres, d’où qu’ils viennent (sans accent).", "en": "What unites two beings, wherever they come from, in French (no accent).", "ru": "То, что объединяет двух существ, откуда бы они ни были (по-французски, без акцента)."}}, {"n": {"fr": "Fenêtre de tir", "en": "Launch Window", "ru": "Стартовое окно"}, "tz": {"fr": "La fusée de retour décolle ce soir. Avec ou sans toi.", "en": "The return rocket lifts off tonight. With or without you.", "ru": "Ракета улетает сегодня вечером. С тобой или без тебя."}, "st": {"fr": ["La mission touche à sa fin. La fusée de retour doit décoller au coucher du soleil, quand les planètes seront parfaitement alignées. La prochaine fenêtre ? Dans deux ans.", "Mais ce matin, l’ordinateur de bord a raté une mise à jour. Il a tout oublié, sauf une chose : il refusera de décoller sans le mot de lancement.", "Les ingénieurs l’avaient caché, lettre par lettre, dans les instruments de la base, pour éviter tout départ accidentel.", "Oki fixe le soleil qui descend déjà vers l’horizon. « Deux ans de plus ici ? Hors de question. Au travail ! »"], "en": ["The mission is ending. The return rocket must lift off at sunset, when the planets are perfectly aligned. The next window? Two years from now.", "But this morning the flight computer botched an update. It forgot everything except one thing: it won’t launch without the launch word.", "The engineers had hidden it, letter by letter, in the base’s instruments to prevent any accidental departure.", "Oki stares at the sun already sinking towards the horizon. “Two more years here? No way. Let’s get to work!”"], "ru": ["Миссия подходит к концу. Ракета должна стартовать на закате, когда планеты выстроятся в линию. Следующее окно? Через два года.", "Но сегодня утром бортовой компьютер неудачно обновился. Он всё забыл, кроме одного: без стартового слова он не взлетит.", "Инженеры спрятали это слово по буквам в приборах базы, чтобы исключить случайный старт.", "Оки смотрит на солнце, которое уже клонится к горизонту. «Ещё два года здесь? Ну уж нет. За работу!»"]}, "end": {"fr": "Dix, neuf, huit… Les moteurs rugissent, la fusée s’arrache du sol. Oki colle son museau au hublot : la Terre t’attend.", "en": "Ten, nine, eight… The engines roar and the rocket tears free of the ground. Oki presses his snout to the porthole: Earth is waiting.", "ru": "Десять, девять, восемь… Двигатели ревут, ракета отрывается от земли. Оки прижимает нос к иллюминатору: Земля ждёт."}, "w": {"fr": "ORBITE", "en": "ORBITE", "ru": "ORBITE"}, "wh": {"fr": "Le chemin circulaire d’un vaisseau autour d’une planète.", "en": "A ship’s circular path around a planet, in French.", "ru": "Круговой путь корабля вокруг планеты (по-французски)."}}]};

var PICKE = 0, STM = 'pre', RKEY = 'sixieme-sens-rec';
function epi(){ return sc().eps[S.ep || 0]; }
function recs(){ try { return JSON.parse(localStorage.getItem(RKEY)) || {}; } catch (e) { return {}; } }
function recSave(){ var r = recs(), k = S.sc; r[k] = r[k] || {}; r[k][S.ep] = Math.max(r[k][S.ep] || 0, Math.round(S.left)); try { localStorage.setItem(RKEY, JSON.stringify(r)); } catch (e) {} }
function firstEp(id){ var r = recs()[id] || {}, s = scOf(id); for (var i = 0; i < s.eps.length; i++) if (r[i] == null) return i; return 0; }
function hush(){ try { speechSynthesis.cancel(); } catch (e) {} if (NAT) nat('speak', {text: ' ', lang: 'fr-FR'}).catch(function(){}); }
function renderEps(){
  var s = scOf(PICK), r = recs()[s.id] || {};
  $('#eps').innerHTML = s.eps.map(function(e, i){ return '<button class="ep' + (i === PICKE ? ' on' : '') + '" data-i="' + i + '"><span class="en">' + (i + 1) + '</span><span class="et"><b>' + L(e.n) + '</b><small>' + L(e.tz) + '</small></span>' + (r[i] != null ? '<span class="rec">✓ ' + fmt(r[i]) + '</span>' : '') + '</button>'; }).join('');
  $('#eps').querySelectorAll('.ep').forEach(function(b){ b.onclick = function(){ PICKE = +b.getAttribute('data-i'); beep(1100, .03, 'sine', .05); renderEps(); }; });
}
function storyEp(){ return STM === 'pre' ? {s: scOf(PICK), i: PICKE} : {s: sc(), i: S.ep}; }
function renderStory(){
  var o = storyEp(), e = o.s.eps[o.i]; theme(o.s.id);
  $('#sT').textContent = L(e.n);
  $('#sM').innerHTML = '<span class="chip">' + L(o.s.n) + '</span><span class="chip">' + T('epN', {n: o.i + 1}) + '</span>';
  $('#sTx').innerHTML = '<p class="tz">' + L(e.tz) + '</p>' + L(e.st).map(function(p, i){ return '<p style="animation-delay:' + (.3 + i * .6) + 's">' + p + '</p>'; }).join('');
  tset('#sGo', STM === 'pre' ? 'teamGo' : 'backL'); tset('#sBack', STM === 'pre' ? 'back2' : 'locks');
}
function openStory(m){ STM = m; clean(); var o = storyEp(); $('#sArt').innerHTML = hero(o.s.id); renderStory(); show('story'); }
function readStory(){ var o = storyEp(), e = o.s.eps[o.i]; okiSay(T('o_tell'), 'h'); say(T('o_tell') + ' ' + L(e.tz) + ' ' + L(e.st).join(' '), 1.15); }

/* ================= écran et batterie ================= */
var PWR = {eco: false, auto: false, manual: false, lock: null, bat: null, susp: null};
function inGame(){ return !!(S && S.start && !S.end); }
function awake(on){
  if (NAT) { nat('keepAwake', {on: !!on}).catch(function(){}); return; }
  try {
    if (on) {
      if (PWR.lock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function(l){ PWR.lock = l; l.addEventListener('release', function(){ PWR.lock = null; }); }).catch(function(){});
    } else if (PWR.lock) { PWR.lock.release().catch(function(){}); PWR.lock = null; }
  } catch (e) {}
}
function ecoBtn(){ $('#batI').textContent = PWR.eco ? '🍃' : '🔋'; }
function setEco(v, auto){
  PWR.eco = v; PWR.auto = !!auto; document.body.classList.toggle('eco', v);
  BG.drawn = false; if (BG.cv) bgResize(); ambSync(); ecoBtn();
}
function batUpdate(level, charging){
  $('#bat').textContent = Math.round(level * 100) + '%';
  if (PWR.manual) return;
  var low = !charging && level <= .2;
  if (low && !PWR.eco) { setEco(true, true); if (inGame()) okiSay(T('o_eco'), 'w'); }
  else if (!low && PWR.eco && PWR.auto) setEco(false);
}
function batInit(){
  if (navigator.getBattery) navigator.getBattery().then(function(b){ PWR.bat = b; function u(){ batUpdate(b.level, b.charging); } u(); b.addEventListener('levelchange', u); b.addEventListener('chargingchange', u); }).catch(natBat);
  else natBat();
  function natBat(){ if (!NAT) return; function q(){ nat('battery').then(function(r){ batUpdate(r.level, r.charging); }).catch(function(){}); } q(); setInterval(function(){ if (!document.hidden) q(); }, 60000); }
}
function onVis(){
  if (document.visibilityState === 'hidden') {
    if (SCR === 'puz' && cur >= 0 && S && !S.solved[cur] && !isCl(sc().p[cur])) { PWR.susp = cur; clean(); }
    ambStop(); vib(0); hush();
    if (actx && actx.state === 'running') actx.suspend().catch(function(){});
  } else if (inGame()) {
    awake(true); updHud();
    if (actx) actx.resume().then(ambSync).catch(function(){});
    if (PWR.susp != null) { var i = PWR.susp; PWR.susp = null; if (SCR === 'puz' && cur === i) openP(i); }
  }
}

re cherche les lettres dans la table, l’archiviste écrit.", "en": "One reads the signals, another looks up the letters, the scribe writes.", "ru": "Один читает сигналы, другой ищет буквы в таблице, летописец записывает."}, "symbols": {"fr": "Chacun résout une ligne sur papier, puis on met en commun.", "en": "Each person solves one line on paper, then pool the results.", "ru": "Каждый решает одну строку на бумаге, затем сверяете."}, "magic": {"fr": "Recopiez la grille sur papier et remplissez-la ensemble.", "en": "Copy the grid on paper and fill it in together.", "ru": "Перерисуйте сетку на бумагу и заполните вместе."}, "master": {"fr": "Chacun prend un indice et dit ce qu’il élimine, l’archiviste tient la liste des chiffres possibles.", "en": "Each person takes a clue and says what it rules out, the scribe keeps the list of possible digits.", "ru": "Каждый берёт подсказку и говорит, что она исключает, летописец ведёт список возможных цифр."}, "taquin": {"fr": "Le décodeur fait glisser, les autres repèrent les pièces et proposent le prochain coup.", "en": "The decoder slides, the others spot pieces and suggest the next move.", "ru": "Дешифровщик двигает плитки, остальные ищут части и подсказывают ход."}, "lights": {"fr": "Réfléchissez avant d’appuyer : un joueur propose, un autre valide.", "en": "Think before pressing: one player proposes, another approves.", "ru": "Думайте перед нажатием: один предлагает, другой одобряет."}, "nono": {"fr": "Partagez-vous le travail : l’un s’occupe des lignes, l’autre des colonnes.", "en": "Split the work: one takes the rows, the other the columns.", "ru": "Разделите работу: один занимается строками, другой столбцами."}, "seq": {"fr": "Chacun teste une règle différente (écart, moitié, somme), puis on vote.", "en": "Each person tests a different rule (gap, half, sum), then vote.", "ru": "Каждый проверяет своё правило (шаг, половина, сумма), затем голосуйте."}, "final": {"fr": "L’archiviste dicte le mot et le code, le décodeur les sais
