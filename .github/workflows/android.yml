name: APK Android
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: SDK Android (préinstallé sur le runner) et licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Dépendances Capacitor
        run: npm install
      - name: Projet Android
        run: |
          npx cap add android
          node native/patch-manifest.js
          cp native/SensorsPlugin.java native/MainActivity.java android/app/src/main/java/com/escapator/app/
      - name: Icônes et écran de démarrage
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#101923' --splashBackgroundColor '#101923'
      - name: Compilation
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk escapator.apk
      - uses: actions/upload-artifact@v4
        with: { name: escapator-apk, path: escapator.apk }
      - name: Publier dans Releases (toujours la dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Escapator (dernière version)
          body: APK de test généré automatiquement à chaque push. Installer en autorisant les sources inconnues.
          make_latest: true
          files: escapator.apk
      - name: Publier une version numérotée
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: escapator.apk }
